<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" role="img" aria-labelledby="t6">
  <title id="t6">Rosa de los vientos y astrolabio</title>
  <rect width="200" height="400" fill="#20272e"/>
  <rect x="8" y="8" width="184" height="384" rx="2" fill="none" stroke="#3b4852" stroke-width="1"/>
  <line x1="16" y1="24" x2="184" y2="24" stroke="#303b44" stroke-width="0.75"/>
  <line x1="16" y1="376" x2="184" y2="376" stroke="#303b44" stroke-width="0.75"/>
  <!-- Celestial Astrolabe Rings -->
  <circle cx="100" cy="190" r="62" fill="none" stroke="#3d4d59" stroke-width="1.2"/>
  <circle cx="100" cy="190" r="50" fill="none" stroke="#cfa75d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="100" cy="190" r="36" fill="none" stroke="#3d4d59" stroke-width="1"/>
  <!-- Compass Star -->
  <g transform="translate(100, 190)">
    <!-- North/South/East/West -->
    <polygon points="0,-48 4,-12 0,0 -4,-12" fill="#e8c278"/>
    <polygon points="0,-48 0,0 -4,-12" fill="#cf9f4d"/>
    <polygon points="0,48 4,12 0,0 -4,12" fill="#e8c278"/>
    <polygon points="0,48 0,0 4,12" fill="#cf9f4d"/>
    <polygon points="48,0 12,4 0,0 12,-4" fill="#e8c278"/>
    <polygon points="48,0 0,0 12,4" fill="#cf9f4d"/>
    <polygon points="-48,0 -12,4 0,0 -12,-4" fill="#e8c278"/>
    <polygon points="-48,0 0,0 -12,-4" fill="#cf9f4d"/>
    <!-- Diagonal smaller points -->
    <polygon points="26,-26 8,-4 0,0 4,-8" fill="#8caab8"/>
    <polygon points="-26,-26 -4,-8 0,0 -8,-4" fill="#8caab8"/>
    <polygon points="26,26 4,8 0,0 8,4" fill="#8caab8"/>
    <polygon points="-26,26 -8,4 0,0 -4,8" fill="#8caab8"/>
    <circle cx="0" cy="0" r="3.5" fill="#f8f4ed"/>
  </g>
  <circle cx="100" cy="85" r="2" fill="#cfa75d"/>
  <circle cx="100" cy="305" r="2" fill="#cfa75d"/>
</svg>