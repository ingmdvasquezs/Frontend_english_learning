# Project identification
sonar.projectKey=English-Reading-frontend
sonar.projectName=English Reading frontend

# Source and test locations
sonar.sources=src
sonar.tests=src

# Test inclusions & general exclusions
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts

# Coverage reporting
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Default local SonarQube host (authentication token provided by user at runtime)
sonar.host.url=http://localhost:9000
