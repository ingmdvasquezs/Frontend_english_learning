<div class="reading-cover-container">
  @if (imageUrl(); as url) {
    <img
      [src]="url"
      [alt]="resolvedAlt()"
      loading="lazy"
      width="1672"
      height="941"
      class="cover-image"
      (error)="onImageError()"
    />
  } @else {
    <div class="cover-fallback" aria-hidden="true">
      <svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span class="fallback-monogram">ERP</span>
    </div>
  }
</div>
