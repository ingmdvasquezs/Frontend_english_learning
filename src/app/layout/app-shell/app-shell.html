<div class="app-shell" [class.shell-immersive]="isImmersive()">
  <header class="mobile-bar">
    <button type="button" class="icon-button" aria-label="Abrir navegación" [attr.aria-expanded]="drawerOpen()" (click)="drawerOpen.set(true)">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand">ERP</span>
  </header>

  @if (drawerOpen()) {
    <button type="button" class="drawer-backdrop" aria-label="Cerrar navegación" (click)="closeDrawer()"></button>
  }

  <aside class="sidebar" [class.drawer-open]="drawerOpen()" aria-label="Navegación principal">
    <div class="sidebar-top">
      <a routerLink="/home" class="brand" aria-label="English Reading Platform, inicio" (click)="closeDrawer()">
        <span class="brand-name">ERP</span>
        <span class="brand-tagline">Historias · Vocabulario · Inglés</span>
      </a>
      <button type="button" class="icon-button mobile-close" aria-label="Cerrar navegación" (click)="closeDrawer()">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeDrawer()">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Inicio</span>
      </a>
      <a routerLink="/library" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeDrawer()">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg><span class="nav-label">Mi biblioteca</span>
      </a>
      <a (click)="navigateToExplore()" class="nav-explore-link" tabindex="0" role="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg><span class="nav-label">Explorar</span>
      </a>
      <a routerLink="/vocabulary" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeDrawer()">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="nav-label">Mi vocabulario</span>
      </a>
    </nav>

    <!-- Ilustración y lema editorial de la referencia -->
    <div class="sidebar-editorial-illustration" aria-hidden="true">
      <svg class="landscape-svg" viewBox="0 0 200 120" fill="none" stroke="currentColor">
        <path d="M10 110 Q50 60 90 90 T170 50 L190 110 Z" fill="color-mix(in srgb, var(--app-border) 40%, transparent)" opacity="0.6"/>
        <path d="M0 115 Q60 40 120 85 T200 30 L200 120 L0 120 Z" fill="color-mix(in srgb, var(--app-border) 60%, transparent)" opacity="0.4"/>
        <path d="M30 110 Q70 80 110 100 T190 75" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        <path d="M15 110 C45 95 75 90 105 105 C135 120 165 95 195 110" stroke-width="1.2" opacity="0.7"/>
      </svg>
      <p class="sidebar-editorial-quote">A more curious you in a more connected world.</p>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-action theme-toggle-btn" (click)="themeService.toggleTheme()" [attr.aria-label]="themeService.theme() === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'">
        @if (themeService.theme() === 'light') {
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Modo oscuro</span>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15.5A9 9 0 0 1 8.5 4 8 8 0 1 0 20 15.5z"/></svg><span>Modo claro</span>
        }
      </button>
      <button type="button" class="sidebar-action user-profile-btn" aria-label="Abrir menú de usuario" [attr.aria-expanded]="userMenuOpen()" (click)="userMenuOpen.set(!userMenuOpen())">
        <span class="profile-avatar" aria-hidden="true">{{ profileInitials() }}</span><span class="profile-copy"><strong>{{ profileLabel() }}</strong><small>Aprendiendo inglés</small></span>
      </button>
      @if (userMenuOpen()) {
        <div class="user-menu">
          <a routerLink="/profile" (click)="userMenuOpen.set(false); closeDrawer()">Mi perfil</a>
          <button type="button" (click)="logout()">Cerrar sesión</button>
        </div>
      }
    </div>
  </aside>

  <div class="shell-content"><router-outlet /></div>
</div>
